[project]
name = "axon"
version = "0.1.0"
description = "AXON — Jarvis-like local AI assistant with full PC control"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "loguru>=0.7",

    # LLM
    "anthropic>=0.39",

    # Audio
    "sounddevice>=0.4",
    "numpy>=1.24",
    "keyboard>=0.13",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",

    # Screen capture
    "mss>=9.0",
    "Pillow>=10.0",

    # PC Control
    "pyautogui>=0.9",
    "pywinauto>=0.6",
    "pywin32>=306",
    "pyperclip>=1.8",
    "pynput>=1.7",

    # Code execution
    "psutil>=5.9",

    # Memory
    "chromadb>=0.4",

    # Search
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
    "diskcache>=5.6",

    # UI
    "PyQt6>=6.5",
    "qasync>=0.27",
    "pygame>=2.5",

    # Utilities
    "rich>=13.0",
]

[project.scripts]
axon = "axon:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
